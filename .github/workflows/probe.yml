name: probe

# Live-reads every registered source once a day and publishes the health ledger.
# The probe and think cycle share one health-ledger implementation and one writer
# lock. A source moves between registered / verified-live-read / blocked only from
# a recorded read, never from a hand-edited registry assertion.
#
# NOTE ON `set -o pipefail`: this step originally ran
# `python3 tools/probe_sources.py 2>&1 | tee data/probe.log` with no pipefail.
# A pipeline's status is its LAST command's status, so `tee` succeeded and the
# step went GREEN while the probe crashed on its first source with a TypeError
# and read nothing at all.  The job looked healthy for days while publishing
# nothing.  pipefail makes the real exit code reach the runner.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with think.yml: both mutate source_health.json and generated state.
  group: msl-state-writer-main
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe every registered source
        shell: bash
        run: |
          set -o pipefail
          python3 tools/probe_sources.py 2>&1 | tee data/probe.log

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### source health"
            echo '```'
            cat data/probe.log 2>/dev/null || echo "(probe produced no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the health ledger
        if: always()
        shell: bash
        run: |
          git config user.name  "MasterSelfLearn"
          git config user.email "buffedlizard55@gmail.com"
          git add data/source_health.json data/probe.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change in source health"
          else
            git commit -m "probe: source health ledger"
            git push
          fi
