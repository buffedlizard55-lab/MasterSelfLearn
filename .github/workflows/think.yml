name: think

# The engine's heartbeat.  No manual input anywhere: cron fires, the pipeline
# reads official public data, appends to the ledger, regenerates the site and
# docs, and commits.  A cycle that reads nothing still publishes and says so —
# it never fills the gap.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'msl/**'
      - 'tools/**'
      - 'data/seed/**'
      - '.github/workflows/think.yml'

permissions:
  contents: write

# Every workflow that can write generated state shares this lock. Separate locks
# let probe and think start from the same commit and race non-fast-forward pushes.
concurrency:
  group: msl-state-writer-main
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove the evidence gate rejects before trusting anything
        run: python3 -m msl.cli selftest

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run one cycle
        id: cycle
        # continue-on-error is deliberate: a cycle that reads nothing must still
        # publish and say so.  But without pipefail the step's status came from
        # `tee`, so even a hard crash exited 0 and the step looked green.  With
        # pipefail the runner records the real failure (a visible warning) while
        # continue-on-error still lets the later steps publish and commit.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 -m msl.cli cycle 2>&1 | tee data/cycle.log

      - name: Re-check every derived claim
        id: verify
        # Publish the finding first, then fail the job explicitly after committing.
        # That preserves the audit artifact without turning a red verifier green.
        continue-on-error: true
        run: python3 tools/verify_claims.py

      - name: Report
        if: always()
        run: |
          echo "### cycle result" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat data/cycle.log >> "$GITHUB_STEP_SUMMARY" || echo "no cycle output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the cycle output
        if: always()
        run: |
          git config user.name  "MasterSelfLearn"
          git config user.email "buffedlizard55@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed; not committing an empty cycle"
          else
            CYCLE=$(python3 -c "import json;print(json.load(open('data/memory.json'))['cyclesRun'])" 2>/dev/null || echo "?")
            git commit -m "cycle ${CYCLE}: autonomous research pass

            Generated by .github/workflows/think.yml with no manual input.
            Counts come from data/site.js AUTO:COUNTS; see VERIFICATION.md."
            git push
          fi

      - name: Fail visibly if research or verification failed
        if: ${{ always() && (steps.cycle.outcome != 'success' || steps.verify.outcome != 'success') }}
        run: |
          echo "::error::Cycle or derived-claim verification failed; generated diagnostics were committed above."
          exit 1
